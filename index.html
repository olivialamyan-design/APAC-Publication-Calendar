<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APAC Research Publication Calendar — Savills</title>
  <meta name="description" content="Internal publication calendar and planning platform for Savills APAC Research.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2325273A'/%3E%3Crect x='7' y='9' width='18' height='3' fill='%23FFDF00'/%3E%3Crect x='7' y='15' width='18' height='3' fill='%23EEE8E3'/%3E%3Crect x='7' y='21' width='12' height='3' fill='%23CE181E'/%3E%3C/svg%3E">
</head>
<body>
  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="30" height="30" viewBox="0 0 32 32" aria-label="Savills APAC Research">
        <rect width="32" height="32" rx="4" fill="#25273A"/>
        <rect x="7" y="9" width="18" height="3" fill="#FFDF00"/>
        <rect x="7" y="15" width="18" height="3" fill="#EEE8E3"/>
        <rect x="7" y="21" width="12" height="3" fill="#CE181E"/>
      </svg>
      <div class="brand-txt">
        <div class="brand-1">SAVILLS</div>
        <div class="brand-2">APAC Research · Publication Calendar</div>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="View">
      <button class="tab" data-view="calendar" role="tab">Calendar</button>
      <button class="tab" data-view="table" role="tab">Table</button>
    </nav>

    <div class="top-actions">
      <span id="resultCount" class="result-count tnum"></span>
      <button id="btnLegend" class="btn-ghost">Legend</button>
      <button id="btnFilters" class="btn-ghost only-mobile">Filters</button>
      <button id="btnCsv" class="btn-ghost">Export CSV</button>
      <button id="btnAdd" class="btn-primary">+ Add publication</button>
    </div>
  </header>

  <!-- ===================== LEGEND (toggle) ===================== -->
  <div id="legend" class="legend" aria-label="Market colour legend"></div>

  <!-- ===================== FILTER BAR (sticky) ===================== -->
  <section id="filterBar" class="filter-bar" aria-label="Filters"></section>

  <!-- ===================== VIEW MOUNT ===================== -->
  <main id="viewMount" class="view-mount" role="main"></main>

  <!-- ===================== SCRIPTS (order matters) ===================== -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/views/helpers.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/form.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/table.js"></script>
  <script src="js/views/leadership.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

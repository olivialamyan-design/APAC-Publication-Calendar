<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APAC Research Publication Calendar — Savills</title>
  <meta name="description" content="Internal publication calendar and planning platform for Savills APAC Research.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dual-fix.css">
  <script>
    (function () {
      try {
        var saved = (typeof localStorage !== "undefined") && localStorage.getItem("apac-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2325273A'/%3E%3Crect x='7' y='9' width='18' height='3' fill='%23FFDF00'/%3E%3Crect x='7' y='15' width='18' height='3' fill='%23EEE8E3'/%3E%3Crect x='7' y='21' width='12' height='3' fill='%23CE181E'/%3E%3C/svg%3E">
</head>
<body>
  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="30" height="30" viewBox="0 0 32 32" aria-label="Savills APAC Research">
        <rect width="32" height="32" rx="4" fill="#25273A"/>
        <rect x="7" y="9" width="18" height="3" fill="#FFDF00"/>
        <rect x="7" y="15" width="18" height="3" fill="#EEE8E3"/>
        <rect x="7" y="21" width="12" height="3" fill="#CE181E"/>
      </svg>
      <div class="brand-txt">
        <div class="brand-1">SAVILLS</div>
        <div class="brand-2">APAC Research · Publication Calendar</div>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="View">
      <button class="tab" data-view="calendar" role="tab">Calendar</button>
      <button class="tab" data-view="quarters" role="tab">Quarters</button>
      <button class="tab" data-view="table" role="tab">Table</button>
    </nav>

    <div class="topbar-search">
      <input id="topSearch" class="fb-search top-search" type="search"
             placeholder="Search name, notes, city, team…"
             aria-label="Search publications">
    </div>

    <div class="top-actions">
      <span id="resultCount" class="result-count tnum"></span>
      <button id="btnTheme" class="theme-toggle" title="Toggle light / dark" aria-label="Toggle theme">
        <span class="icon" aria-hidden="true">◐</span>
      </button>
      <div class="legend-wrap">
        <button id="btnLegend" class="btn-ghost" aria-haspopup="true" aria-expanded="false">Legend</button>
        <div id="legendTip" class="legend-tip" role="tooltip" aria-hidden="true"></div>
      </div>
      <button id="btnFilters" class="btn-ghost only-mobile">Filters</button>
      <a id="btnAnalytics"
         href="https://dash.cloudflare.com/090fa2a20912fc64d65acb727ec95c36/web-analytics/overview?siteTag~in=a399309612f04b6daf0f2e119a82724b&excludeBots=Yes&time-window=10080"
         target="_blank"
         rel="noopener noreferrer"
         class="btn-ghost"
         title="Open Cloudflare Web Analytics dashboard">
        Usage
      </a>
    </div>
  </header>

  <!-- ===================== LEGEND (toggle) ===================== -->
  <div id="legend" class="legend" aria-label="Market colour legend"></div>

  <!-- ===================== FILTER BAR (sticky) ===================== -->
  <section id="filterBar" class="filter-bar" aria-label="Filters"></section>

  <!-- ===================== VIEW MOUNT ===================== -->
  <main id="viewMount" class="view-mount" role="main"></main>

  <!-- ===================== SCRIPTS (order matters) ===================== -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/views/helpers.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/form.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/table.js"></script>
  <script src="js/views/quarters.js"></script>
  <script src="js/views/leadership.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/app.js"></script>

  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4a48041f902247a4952ceb8171671f25"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
